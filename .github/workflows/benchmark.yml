---
name: Performance Benchmarks

# Run on PRs and main branch pushes to catch performance regressions
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fps-validation:
    name: FPS Target Validation (60 FPS @ 2000 entities)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libc6-dev libgl1-mesa-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxrandr-dev libxxf86vm-dev \
            libasound2-dev pkg-config jq bc

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run FPS Benchmark (2000 entities)
        run: |
          mkdir -p build
          
          # Run the dedicated FPS benchmark with 2000 entities and capture results
          # Uses pkg/benchmark/fps/ for separated FPS/memory test infrastructure
          go test -run='^$' -bench='^BenchmarkFPS2000Entities$' \
            -benchmem -benchtime=3s ./pkg/benchmark/fps/ > build/fps-benchmark.txt 2>&1 || true
          
          # Display results
          cat build/fps-benchmark.txt

      - name: Validate FPS Target (60 FPS minimum)
        run: |
          # Extract ns/op from benchmark output
          NS_PER_OP=$(grep "BenchmarkFPS2000Entities" build/fps-benchmark.txt | awk '{print $3}' | head -1)
          
          if [ -z "$NS_PER_OP" ]; then
            echo "ERROR: Benchmark not found or failed to run"
            exit 1
          fi
          
          # Convert to numeric (remove any suffix like "ns/op")
          NS_PER_OP=$(echo "$NS_PER_OP" | sed 's/[^0-9.]//g')
          
          echo "Benchmark result: ${NS_PER_OP} ns/op"
          
          # Calculate FPS from ns/op
          # FPS = 1,000,000,000 ns/s ÷ ns/op
          FPS=$(echo "scale=2; 1000000000 / $NS_PER_OP" | bc)
          
          echo "Calculated FPS: ${FPS}"
          
          # Target: 60 FPS minimum
          # 60 FPS = 16.67ms per frame = 16,666,666 ns per frame
          MAX_NS_PER_FRAME=16666666
          
          if (( $(echo "$NS_PER_OP > $MAX_NS_PER_FRAME" | bc -l) )); then
            echo "❌ FAILED: Performance below 60 FPS target"
            echo "   Expected: ≤16,666,666 ns/op (60 FPS)"
            echo "   Actual:   ${NS_PER_OP} ns/op (${FPS} FPS)"
            exit 1
          fi
          
          echo "✅ PASSED: Performance meets 60 FPS target (${FPS} FPS)"

      - name: Upload FPS benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fps-benchmark-results
          path: build/fps-benchmark.txt
          retention-days: 30

  memory-validation:
    name: Memory Target Validation (<500MB @ 2000 entities)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libc6-dev libgl1-mesa-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxrandr-dev libxxf86vm-dev \
            libasound2-dev pkg-config jq bc

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run Memory Bounds Test
        run: |
          mkdir -p build
          
          # Run memory bounds test with verbose output
          go test -v -run='^TestMemoryBounds2000Entities$' \
            ./pkg/engine/ > build/memory-test.txt 2>&1 || {
            cat build/memory-test.txt
            exit 1
          }
          
          # Display results
          cat build/memory-test.txt

      - name: Validate Memory Target (<500MB)
        run: |
          # Extract memory usage from test output
          # Test should output: "Memory usage: X MB"
          MEMORY_MB=$(grep "Memory usage:" build/memory-test.txt | awk '{print $3}' | head -1)
          
          if [ -z "$MEMORY_MB" ]; then
            echo "ERROR: Memory measurement not found in test output"
            exit 1
          fi
          
          echo "Memory usage: ${MEMORY_MB} MB"
          
          # Target: <500MB
          if (( $(echo "$MEMORY_MB >= 500" | bc -l) )); then
            echo "❌ FAILED: Memory usage exceeds 500MB target"
            echo "   Expected: <500 MB"
            echo "   Actual:   ${MEMORY_MB} MB"
            exit 1
          fi
          
          echo "✅ PASSED: Memory usage within 500MB target (${MEMORY_MB} MB)"

      - name: Upload memory test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memory-test-results
          path: build/memory-test.txt
          retention-days: 30

  comprehensive-benchmarks:
    name: Comprehensive Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libc6-dev libgl1-mesa-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxrandr-dev libxxf86vm-dev \
            libasound2-dev pkg-config jq bc

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run All Engine Benchmarks
        run: |
          mkdir -p build
          
          # Run all benchmarks in engine package with memory stats
          go test -run='^$' -bench=. -benchmem -benchtime=1s \
            ./pkg/engine/ > build/comprehensive-benchmarks.txt 2>&1 || true
          
          # Display summary (first 100 lines)
          head -100 build/comprehensive-benchmarks.txt

      - name: Upload comprehensive benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comprehensive-benchmark-results
          path: build/comprehensive-benchmarks.txt
          retention-days: 30
