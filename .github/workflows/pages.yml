name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.5'

      - name: Build WebAssembly binary
        run: |
          GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o build/wasm/venture.wasm ./cmd/client

      - name: Copy wasm_exec.js runtime
        run: |
          cp $(go env GOROOT)/lib/wasm/wasm_exec.js build/wasm/

      - name: Download latest CodeQL reports (if available)
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: codeql.yml
          name: codeql-html-reports
          path: build/wasm/security
          if_no_artifact_found: warn

      - name: Create security index page
        run: |
          mkdir -p build/wasm/security
          cat > build/wasm/security/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Venture - Security Reports</title>
              <style>
                  body {
                      margin: 0;
                      padding: 0;
                      background: #1a1a1a;
                      color: #ffffff;
                      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                  }
                  .container {
                      max-width: 1200px;
                      margin: 0 auto;
                      padding: 40px 20px;
                  }
                  header {
                      text-align: center;
                      margin-bottom: 40px;
                      padding-bottom: 20px;
                      border-bottom: 2px solid #4CAF50;
                  }
                  h1 {
                      color: #4CAF50;
                      margin-bottom: 10px;
                  }
                  .subtitle {
                      color: #888;
                      font-size: 1.1em;
                  }
                  .back-link {
                      display: inline-block;
                      margin-bottom: 20px;
                      color: #4CAF50;
                      text-decoration: none;
                      font-size: 1.1em;
                  }
                  .back-link:hover {
                      text-decoration: underline;
                  }
                  .reports-grid {
                      display: grid;
                      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
                      gap: 20px;
                      margin-top: 30px;
                  }
                  .report-card {
                      background: #2a2a2a;
                      border: 2px solid #333;
                      border-radius: 8px;
                      padding: 20px;
                      transition: all 0.3s ease;
                  }
                  .report-card:hover {
                      border-color: #4CAF50;
                      transform: translateY(-2px);
                      box-shadow: 0 4px 8px rgba(76, 175, 80, 0.2);
                  }
                  .report-card h3 {
                      color: #4CAF50;
                      margin-top: 0;
                  }
                  .report-card p {
                      color: #aaa;
                      line-height: 1.6;
                  }
                  .report-link {
                      display: inline-block;
                      margin-top: 15px;
                      padding: 10px 20px;
                      background: #4CAF50;
                      color: #fff;
                      text-decoration: none;
                      border-radius: 4px;
                      transition: background 0.3s ease;
                  }
                  .report-link:hover {
                      background: #45a049;
                  }
                  .info-section {
                      background: #2a2a2a;
                      border-left: 4px solid #4CAF50;
                      padding: 20px;
                      margin-top: 30px;
                      border-radius: 4px;
                  }
                  .info-section h2 {
                      color: #4CAF50;
                      margin-top: 0;
                  }
                  .info-section ul {
                      line-height: 1.8;
                      color: #ccc;
                  }
                  footer {
                      text-align: center;
                      margin-top: 60px;
                      padding-top: 20px;
                      border-top: 1px solid #333;
                      color: #666;
                  }
              </style>
          </head>
          <body>
              <div class="container">
                  <a href="../" class="back-link">← Back to Game</a>
                  
                  <header>
                      <h1>🔒 Security Analysis Reports</h1>
                      <p class="subtitle">CodeQL automated security scanning for Venture</p>
                  </header>

                  <div class="info-section">
                      <h2>About CodeQL Analysis</h2>
                      <p>
                          These reports are automatically generated by GitHub's CodeQL security analysis engine.
                          CodeQL performs deep semantic analysis of the Go codebase to identify potential
                          security vulnerabilities, code quality issues, and best practice violations.
                      </p>
                      <ul>
                          <li><strong>Scan Frequency:</strong> On every push to main, pull requests, and weekly on Mondays</li>
                          <li><strong>Query Packs:</strong> Security-extended and security-and-quality queries</li>
                          <li><strong>Language:</strong> Go 1.24.5+</li>
                          <li><strong>Results:</strong> Automatically uploaded to GitHub Security tab</li>
                      </ul>
                  </div>

                  <div class="reports-grid">
                      <div class="report-card">
                          <h3>📊 Latest CodeQL Report</h3>
                          <p>
                              View the most recent security analysis results in HTML format.
                              This includes all findings categorized by severity.
                          </p>
                          <a href="codeql-results.html" class="report-link">View Report</a>
                      </div>

                      <div class="report-card">
                          <h3>🔍 GitHub Security Tab</h3>
                          <p>
                              Access detailed security findings with code locations,
                              data flow analysis, and remediation guidance.
                          </p>
                          <a href="https://github.com/${GITHUB_REPOSITORY}/security/code-scanning" 
                             class="report-link" target="_blank">View on GitHub →</a>
                      </div>

                      <div class="report-card">
                          <h3>📚 Documentation</h3>
                          <p>
                              Learn more about the security practices and analysis
                              configuration for this project.
                          </p>
                          <a href="https://github.com/opd-ai/venture/blob/main/docs/SECURITY.md" 
                             class="report-link" target="_blank">Read Docs →</a>
                      </div>
                  </div>

                  <footer>
                      <p>Generated by GitHub Actions CodeQL workflow | Last updated: <span id="timestamp"></span></p>
                  </footer>
              </div>

              <script>
                  // Display current timestamp
                  document.getElementById('timestamp').textContent = new Date().toLocaleString();
              </script>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/wasm'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
