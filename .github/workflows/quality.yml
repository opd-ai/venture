---
name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Run weekly on Sundays at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  feature-audit:
    name: Feature Completeness Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run Feature Audit
        run: go run ./examples/featureaudit

  visual-regression:
    name: Visual Regression Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libc6-dev libgl1-mesa-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev libasound2-dev pkg-config xvfb

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run Visual Regression Tests
        run: xvfb-run -s "-screen 0 1920x1080x24" go run ./examples/visualregressiontest

  parity-test:
    name: Cross-Platform Parity Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run Parity Tests
        run: go run ./examples/paritytest

  dev-tools-tests:
    name: Development Tools Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libc6-dev libgl1-mesa-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev libasound2-dev pkg-config xvfb

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Test pkg/audit/features
        run: go test -cover ./pkg/audit/features/...

      - name: Test pkg/visualtest
        run: xvfb-run -s "-screen 0 1920x1080x24" go test -cover ./pkg/visualtest/...

      - name: Test pkg/visualtest/parity
        run: go test -cover ./pkg/visualtest/parity/...

      - name: Test pkg/procgen/audit (Determinism Validation)
        run: xvfb-run -s "-screen 0 1920x1080x24" go test -v ./pkg/procgen/audit/...

  balance-validation:
    name: Balance Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libc6-dev libgl1-mesa-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev libasound2-dev pkg-config

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Test pkg/balance
        run: go test -cover ./pkg/balance/...

      - name: Build server
        run: go build -o ./build/venture-server ./cmd/server

      - name: Run Balance Validation
        run: timeout 120 ./build/venture-server --balance-validate || true

  ux-validation:
    name: UX Journey Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libc6-dev libgl1-mesa-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev libasound2-dev pkg-config

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Test pkg/ux
        run: go test -cover ./pkg/ux/...

      - name: Build server
        run: go build -o ./build/venture-server ./cmd/server

      - name: Run UX Validation
        run: timeout 60 ./build/venture-server --ux-validate || true
