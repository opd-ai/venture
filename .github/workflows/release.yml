---
name: Release

on:
  schedule:
    # Run nightly at 00:00 UTC
    - cron: '0 0 * * *'
  push:
    branches: [main]
    tags:
      # Match semantic version tags like v1.2.3
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: write

jobs:
  build:
    name: Build All Platforms
    uses: ./.github/workflows/build.yml

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine release info
        id: info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "name=Release ${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "name=Latest Build ($(date +'%Y-%m-%d'))" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "tag=nightly" >> $GITHUB_OUTPUT
            echo "name=Nightly Build $(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Delete existing rolling release
        if: "!startsWith(github.ref, 'refs/tags/v')"
        continue-on-error: true
        run: gh release delete "${{ steps.info.outputs.tag }}" --cleanup-tag --yes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create archives
        run: |
          mkdir -p build
          for dir in artifacts/linux-amd64 artifacts/linux-arm64 artifacts/windows-amd64 artifacts/darwin-amd64 artifacts/darwin-arm64 artifacts/wasm; do
            [ -d "$dir" ] || continue
            cd "$dir"
            if [[ "$dir" == *"wasm"* ]]; then
              tar czf ../../build/venture-wasm.tar.gz *
            else
              for file in venture-server-* venture-client-*; do
                [ -f "$file" ] || continue
                if [[ "$file" == *.exe ]]; then
                  zip "../../build/${file%.exe}.zip" "$file"
                else
                  tar czf "../../build/${file}.tar.gz" "$file"
                fi
              done
            fi
            cd - > /dev/null
          done
          [ -d artifacts/android-apk ] && cp artifacts/android-apk/*.apk build/ || true
          cd build && find . -maxdepth 1 -type f -print0 | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.info.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.info.outputs.name }}
          prerelease: ${{ steps.info.outputs.prerelease }}
          generate_release_notes: true
          files: build/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


