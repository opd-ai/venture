<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Venture Game</title>
    <style>
        body {
            margin: 0;
            /* BUG FIX: Phase 0 - Missing safe-area-inset for iPhone X+ notch/home indicator
             * Resolution: Added env(safe-area-inset-*) padding to prevent UI overlap
             * Platform: WASM (iOS Safari, Safari standalone mode) */
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            /* CRITICAL FIX: Don't block touch-action globally - input elements need touch to focus!
             * Setting touch-action: none on body prevents hidden input from receiving focus on mobile.
             * Instead, we apply touch-action: none only to specific elements (canvas).
             * This allows the hidden keyboard input to receive touch/focus while preventing
             * unwanted gestures on the game canvas. */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            /* BUG FIX: Phase 0 - Missing -webkit-tap-highlight-color for iOS tap flash
             * Resolution: Set transparent tap highlight to prevent blue flash on tap
             * Platform: WASM (iOS Safari, Chrome iOS) */
            -webkit-tap-highlight-color: transparent;
        }
        #gameCanvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            /* Prevent canvas-specific touch behaviors like pinch-zoom, but allow touches through */
            touch-action: none;
        }
        /* KEYBOARD FIX: Ensure the hidden keyboard input can receive focus via touch.
         * The input element is positioned off-screen but must remain focusable.
         * Explicitly allow touch-action on input elements so mobile keyboards can trigger. */
        input {
            touch-action: auto !important;
            pointer-events: auto !important;
        }
        #loading {
            position: absolute;
            color: #4CAF50;
            font-family: monospace;
            font-size: 18px;
            text-align: center;
        }
        #error {
            position: absolute;
            color: #f44336;
            font-family: monospace;
            font-size: 14px;
            text-align: center;
            max-width: 600px;
            padding: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="loading">Loading Venture...<br><span style="font-size: 14px;">Generating procedural world...</span></div>
    <div id="error"></div>
    
    <script src="wasm_exec.js"></script>
    <script>
        const loadingDiv = document.getElementById('loading');
        const errorDiv = document.getElementById('error');
        
        function showError(message) {
            loadingDiv.style.display = 'none';
            errorDiv.style.display = 'block';
            errorDiv.textContent = message;
        }
        
        // KEYBOARD FIX: Prevent default touch behaviors (zoom, scroll, pull-to-refresh),
        // BUT allow touch events on INPUT elements so the hidden keyboard input can receive focus.
        // Without this, mobile browsers won't trigger focus on the hidden input when tapped
        // (even though it's programmatically focused, touch-action:none prevents the initial focus).
        document.addEventListener('touchstart', function(e) {
            // CRITICAL: Allow INPUT elements to receive touch events for focus/keyboard
            // Also allow touches on canvas for game controls, and buttons/links for UI
            if (e.target.tagName !== 'A' && 
                e.target.tagName !== 'BUTTON' && 
                e.target.tagName !== 'CANVAS' &&
                e.target.tagName !== 'INPUT') {
                e.preventDefault();
            }
        }, { passive: false });
        
        document.addEventListener('touchmove', function(e) {
            // Allow touch move on canvas for game controls (movement, gestures)
            // Allow touch move on INPUT for selection/cursor positioning
            // Prevent on document to avoid scrolling
            if (e.target.tagName !== 'CANVAS' && e.target.tagName !== 'INPUT') {
                e.preventDefault();
            }
        }, { passive: false });
        
        
        // Prevent context menu on long press
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });
        
        // Prevent double-tap zoom
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
        
        // Check for WebAssembly support
        if (!WebAssembly) {
            showError('WebAssembly is not supported in your browser. Please use a modern browser like Chrome, Firefox, or Safari.');
        } else {
            const go = new Go();
            
            // Load and run the WASM binary
            WebAssembly.instantiateStreaming(fetch("venture.wasm"), go.importObject)
                .then(result => {
                    loadingDiv.style.display = 'none';
                    go.run(result.instance);
                })
                .catch(err => {
                    console.error('Failed to load WASM:', err);
                    showError('Failed to load game: ' + err.message + '\n\nPlease ensure venture.wasm is available and try refreshing the page.');
                });
        }
    </script>
</body>
</html>
