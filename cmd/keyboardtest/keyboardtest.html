<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Virtual Keyboard Test - Venture</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: monospace;
            color: #fff;
            /* KEYBOARD FIX: Don't block touch-action globally - input needs focus! */
            -webkit-user-select: none;
            user-select: none;
        }
        #gameCanvas {
            border: 2px solid #4CAF50;
            border-radius: 8px;
            touch-action: none;
        }
        /* KEYBOARD FIX: Ensure input elements can receive touch for focus */
        input {
            touch-action: auto !important;
            pointer-events: auto !important;
        }
        #status {
            margin-top: 20px;
            padding: 15px;
            background: #2a2a3e;
            border-radius: 5px;
            max-width: 800px;
        }
        #status h3 {
            margin: 0 0 10px 0;
            color: #4CAF50;
        }
        #console-log {
            margin-top: 10px;
            padding: 10px;
            background: #1a1a2e;
            border-radius: 5px;
            max-height: 150px;
            overflow-y: auto;
            font-size: 12px;
            color: #aaa;
        }
        .log-entry {
            margin: 2px 0;
            padding: 2px 5px;
        }
        .log-entry.info {
            color: #4CAF50;
        }
        .log-entry.warn {
            color: #FFC107;
        }
        .log-entry.error {
            color: #f44336;
        }
        #loading {
            position: absolute;
            color: #4CAF50;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div id="loading">Loading Keyboard Test...</div>
    
    <div id="status" style="display: none;">
        <h3>Virtual Keyboard Diagnostic</h3>
        <div id="info">
            <p><strong>Browser:</strong> <span id="browser-info"></span></p>
            <p><strong>Platform:</strong> <span id="platform-info"></span></p>
            <p><strong>Touch Support:</strong> <span id="touch-info"></span></p>
            <p><strong>Keyboard Element:</strong> <span id="keyboard-element-info"></span></p>
        </div>
        <h4>Browser Console Log:</h4>
        <div id="console-log"></div>
    </div>
    
    <script src="wasm_exec.js"></script>
    <script>
        // Console logging capture
        const consoleLog = document.getElementById('console-log');
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;
        
        function addLogEntry(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            consoleLog.appendChild(entry);
            consoleLog.scrollTop = consoleLog.scrollHeight;
        }
        
        console.log = function(...args) {
            originalLog.apply(console, args);
            addLogEntry(args.join(' '), 'info');
        };
        
        console.error = function(...args) {
            originalError.apply(console, args);
            addLogEntry(args.join(' '), 'error');
        };
        
        console.warn = function(...args) {
            originalWarn.apply(console, args);
            addLogEntry(args.join(' '), 'warn');
        };
        
        // Populate browser info
        function updateBrowserInfo() {
            document.getElementById('browser-info').textContent = navigator.userAgent;
            document.getElementById('platform-info').textContent = navigator.platform;
            document.getElementById('touch-info').textContent = 
                ('ontouchstart' in window) ? 'Yes' : 'No';
        }
        
        // Monitor for keyboard element creation
        const observer = new MutationObserver((mutations) => {
            const keyboardInput = document.getElementById('venture-keyboard-input');
            if (keyboardInput) {
                document.getElementById('keyboard-element-info').textContent = 
                    'Found! (id: venture-keyboard-input)';
                document.getElementById('keyboard-element-info').style.color = '#4CAF50';
                console.log('Virtual keyboard element detected in DOM');
                console.log('Element properties:', {
                    type: keyboardInput.type,
                    inputmode: keyboardInput.inputmode,
                    position: keyboardInput.style.position,
                    focused: document.activeElement === keyboardInput
                });
            }
        });
        
        observer.observe(document.body, { 
            childList: true, 
            subtree: true 
        });
        
        // Initial check
        setTimeout(() => {
            const keyboardInput = document.getElementById('venture-keyboard-input');
            if (!keyboardInput) {
                document.getElementById('keyboard-element-info').textContent = 
                    'Not yet created';
                document.getElementById('keyboard-element-info').style.color = '#FFC107';
            }
        }, 1000);
        
        updateBrowserInfo();
        
        // Load WASM
        const go = new Go();
        
        console.log('Loading keyboard test WASM binary...');
        
        WebAssembly.instantiateStreaming(fetch("keyboardtest.wasm"), go.importObject)
            .then(result => {
                console.log('WASM loaded successfully');
                document.getElementById('loading').style.display = 'none';
                document.getElementById('status').style.display = 'block';
                go.run(result.instance);
            })
            .catch(err => {
                console.error('Failed to load WASM:', err);
                document.getElementById('loading').textContent = 
                    'Error loading WASM: ' + err.message;
                document.getElementById('loading').style.color = '#f44336';
            });
            
        // KEYBOARD FIX: Prevent default touch behaviors but allow INPUT elements
        document.addEventListener('touchstart', (e) => {
            // Allow INPUT elements to receive touches for keyboard focus
            if (e.target.tagName !== 'CANVAS' && e.target.tagName !== 'INPUT') {
                e.preventDefault();
            }
        }, { passive: false });
        
        document.addEventListener('touchmove', (e) => {
            // Allow touch move on INPUT for selection
            if (e.target.tagName !== 'CANVAS' && e.target.tagName !== 'INPUT') {
                e.preventDefault();
            }
        }, { passive: false });
        
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });
        
        // Monitor focus changes
        document.addEventListener('focusin', (e) => {
            console.log('Focus changed to:', e.target.tagName, e.target.id || '(no id)');
        });
        
        document.addEventListener('focusout', (e) => {
            console.log('Focus lost from:', e.target.tagName, e.target.id || '(no id)');
        });
    </script>
</body>
</html>
